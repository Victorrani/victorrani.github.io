<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contato · MeteoLab</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #f5f5f2; --superficie: #ffffff; --texto: #1c1c1a; --texto-2: #5f5f5a; --texto-3: #8d8d86;
            --linha: #e3e3dd; --destaque: #2457c5;
            --sombra: 0 1px 2px rgba(20, 20, 15, .06), 0 4px 16px rgba(20, 20, 15, .06);
            --sombra-hover: 0 2px 4px rgba(20, 20, 15, .07), 0 12px 32px rgba(20, 20, 15, .10);
            --raio: 10px; --largura: 1120px;
            --e1: 4px; --e2: 8px; --e3: 12px; --e4: 16px; --e5: 24px; --e6: 32px; --e7: 48px; --e8: 72px; --e9: 112px;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: var(--bg); color: var(--texto); font-family: "Inter", system-ui, -apple-system, "Segoe UI", sans-serif;
               font-size: 16px; line-height: 1.6; -webkit-font-smoothing: antialiased; }
        a { color: inherit; }
        img { display: block; max-width: 100%; height: auto; }
        .num { font-variant-numeric: tabular-nums; }
        .conteiner { max-width: var(--largura); margin: 0 auto; padding: 0 var(--e5); }

        header { border-bottom: 1px solid var(--linha); }
        .topo { display: flex; align-items: center; justify-content: space-between; height: 64px; }
        .marca { font-weight: 700; font-size: 15px; letter-spacing: -.01em; text-decoration: none; }
        nav { display: flex; gap: var(--e5); }
        nav a { text-decoration: none; font-size: 14px; color: var(--texto-2); }
        nav a:hover, nav a.ativo { color: var(--texto); }
        nav a.ativo { font-weight: 600; }

        /* abertura */
        .abertura { padding: var(--e8) 0 var(--e7); max-width: 760px; }
        .sobretitulo { font-size: 13px; font-weight: 600; color: var(--destaque); letter-spacing: .02em; }
        h1 { font-size: 48px; line-height: 1.1; font-weight: 700; letter-spacing: -.03em; margin: var(--e3) 0 var(--e5); }
        .lead { font-size: 19px; color: var(--texto-2); max-width: 58ch; }

        /* destaques */
        .destaques { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--e5); margin-bottom: var(--e9); }
        .destaque {
            display: flex; flex-direction: column; text-decoration: none; background: var(--superficie);
            border-radius: var(--raio); box-shadow: var(--sombra); overflow: hidden; transition: box-shadow .2s, transform .2s;
        }
        .destaque:hover { box-shadow: var(--sombra-hover); transform: translateY(-2px); }
        .destaque-img { padding: var(--e3) var(--e3) 0; }
        .destaque-img img { border-radius: 6px; }
        .destaque-texto { padding: var(--e5); display: flex; flex-direction: column; gap: var(--e2); flex: 1; }
        .etiqueta { font-size: 12px; font-weight: 600; color: var(--texto-3); text-transform: uppercase; letter-spacing: .06em; }
        .destaque h2 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; line-height: 1.3; }
        .destaque p { color: var(--texto-2); font-size: 15px; }
        .numeros-mini { display: flex; gap: var(--e6); margin: var(--e2) 0; }
        .numeros-mini div { display: flex; flex-direction: column; }
        .numeros-mini .rot { font-size: 12px; color: var(--texto-3); }
        .numeros-mini .val { font-size: 22px; font-weight: 600; letter-spacing: -.02em; white-space: nowrap; }
        .numeros-mini .val small { font-size: 13px; font-weight: 500; color: var(--texto-2); }
        .seta { margin-top: auto; padding-top: var(--e3); font-size: 14px; font-weight: 600; color: var(--destaque); }
        .destaque:hover .seta { text-decoration: underline; }

        /* como funciona */
        .secao { padding: var(--e8) 0; border-top: 1px solid var(--linha); }
        .secao h2 { font-size: 22px; font-weight: 600; letter-spacing: -.015em; margin-bottom: var(--e6); }
        .passos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--e6); }
        .passo .quando { font-size: 13px; font-weight: 600; color: var(--destaque); margin-bottom: var(--e2); }
        .passo h3 { font-size: 17px; font-weight: 600; margin-bottom: var(--e2); }
        .passo p { color: var(--texto-2); font-size: 15px; }

        /* semanas */
        .semanas { list-style: none; border-top: 1px solid var(--texto); max-width: 760px; }
        .semanas li { display: grid; grid-template-columns: 140px 1fr auto; gap: var(--e4); align-items: baseline;
                      padding: var(--e4) 0; border-bottom: 1px solid var(--linha); }
        .semanas .sem { font-weight: 600; }
        .semanas .datas { color: var(--texto-2); font-size: 15px; }
        .semanas .links { display: flex; gap: var(--e4); font-size: 14px; }
        .semanas .links a { color: var(--destaque); text-decoration: none; font-weight: 500; }
        .semanas .links a:hover { text-decoration: underline; }
        .semanas .links span { color: var(--texto-3); }

        footer { border-top: 1px solid var(--linha); padding: var(--e6) 0 var(--e7); color: var(--texto-3); font-size: 13px; }
        footer a { color: var(--texto-2); }

        @media (max-width: 860px) {
            .destaques, .passos { grid-template-columns: 1fr; }
            .passos { gap: var(--e5); }
        }
        @media (max-width: 640px) {
            .conteiner { padding: 0 var(--e4); }
            .abertura { padding: var(--e8) 0 var(--e7); }
            h1 { font-size: 34px; }
            .lead { font-size: 17px; }
            nav { gap: var(--e4); }
            .semanas li { grid-template-columns: 1fr; gap: var(--e1); }
            .numeros-mini { gap: var(--e4); }
            .numeros-mini .val { font-size: 18px; }
        }
        .contato { padding-top: var(--e8); padding-bottom: var(--e9); }
        .contato h1 { margin-bottom: var(--e6); }
        .contato a.email { font-size: 22px; font-weight: 600; color: var(--destaque); text-decoration: none; letter-spacing: -.01em; }
        .contato a.email:hover { text-decoration: underline; }
    </style>
</head>
<body>

<header>
    <div class="conteiner topo">
        <a class="marca" href="index.html">MeteoLab</a>
        <nav>
            <a href="index.html">Home</a>
            <a href="forecast.html">Previsão/Avaliação</a>
            <a href="contato.html" class="ativo">Contato</a>
        </nav>
    </div>
</header>

<main class="conteiner contato">
    <h1>Contato</h1>
    <a class="email" href="mailto:victor.ranieri@inpe.br">victor.ranieri@inpe.br</a>
</main>

<footer>
    <div class="conteiner">© 2026 MeteoLab · <a href="mailto:victor.ranieri@inpe.br">victor.ranieri@inpe.br</a></div>
</footer>
</body>
</html>
